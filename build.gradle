plugins {
    id "com.android.application" version "8.3.2"
    id "org.jetbrains.kotlin.android" version "2.2.10"
    id "org.jetbrains.kotlin.plugin.compose" version "2.2.10"
    id "org.jetbrains.kotlin.plugin.serialization" version "2.2.10"
}


android {
    namespace = 'org.equalitie.ouisync.kotlin.example'
    compileSdk 34

    defaultConfig {
        applicationId 'org.equalitie.ouisync.kotlin.example'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.0.1'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')


    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0'

    implementation "ie.equalit.ouinet:ouisync-android:0.9.2-2"
    implementation "ie.equalit.ouinet:ouisync-session:0.9.2-2"
    implementation "ie.equalit.ouinet:ouisync-service:0.9.2-2"

}
